services:
  legal-platform:
    image: legal-knowledge-platform:0.2.0
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal-knowledge-platform
    restart: unless-stopped
    ports:
      - "${LEGAL_PLATFORM_BIND_ADDRESS:-127.0.0.1}:${LEGAL_PLATFORM_PORT:-8080}:8080"
    environment:
      LEGAL_PLATFORM_HOST: 0.0.0.0
      LEGAL_PLATFORM_PORT: 8080
      LEGAL_PLATFORM_DATA_DIR: /app/storage
      LEGAL_PLATFORM_STORAGE_LIMIT_MB: ${LEGAL_PLATFORM_STORAGE_LIMIT_MB:-2048}
    volumes:
      - ${LEGAL_PLATFORM_HOST_DATA_DIR:-./storage}:/app/storage
    init: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
