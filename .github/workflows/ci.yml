name: Verify and package
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: python -m pip install -r requirements.lock -r requirements-test.lock
      - run: python -m pip install --no-deps -e .
      - name: Prepare verified HTTPS proxy for the Windows journey
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $proxyFolder = Join-Path $env:RUNNER_TEMP 'legal-library-caddy'
          New-Item -ItemType Directory -Force -Path $proxyFolder | Out-Null
          $proxyArchive = Join-Path $proxyFolder 'caddy.zip'
          Invoke-WebRequest 'https://github.com/caddyserver/caddy/releases/download/v2.11.2/caddy_2.11.2_windows_amd64.zip' -OutFile $proxyArchive
          if ((Get-FileHash $proxyArchive -Algorithm SHA256).Hash.ToLower() -ne '2902d2a278597e4983d70ed6d694fcab36b29b0b7d109771c59d7da7147afad8') { throw 'Caddy checksum mismatch' }
          Expand-Archive -LiteralPath $proxyArchive -DestinationPath $proxyFolder
          $proxyExecutable = Join-Path $proxyFolder 'caddy.exe'
          Add-Content -Path $env:GITHUB_ENV -Value "LEGAL_PLATFORM_TEST_CADDY=$proxyExecutable"
      - run: python -m pytest --tb=short
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: '22'
      - name: Verify browser catalog and account transitions
        if: runner.os == 'Linux'
        run: |
          node --test tests/browser/i18n.test.cjs
          npm install --prefix tests/browser
          npx --prefix tests/browser playwright install --with-deps chromium
          npm test --prefix tests/browser
      - name: Preserve browser evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: .artifacts/browser-*/
          retention-days: 7
      - name: Validate hosted Compose configuration
        if: runner.os == 'Linux'
        env:
          LEGAL_PLATFORM_DOMAIN: library.example.test
        run: docker compose -f docker-compose.hosted.yml config --quiet
  windows-package:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock -r packaging/requirements-build.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m PyInstaller --noconfirm packaging/LegalLibrary.spec
      - name: Check bundled desktop and PDF runtime
        shell: pwsh
        run: |
          $check = Join-Path $env:RUNNER_TEMP 'legal-library-check'
          $process = Start-Process -FilePath dist/LegalLibrary/LegalLibrary.exe -ArgumentList @('--self-check', '--data-dir', $check) -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0 -or !(Test-Path "$check/self-check.json")) { throw 'Executable runtime check failed' }
      - name: Add instructions
        shell: pwsh
        run: |
          Copy-Item docs/WINDOWS-QUICKSTART.md dist/LegalLibrary/START-HERE.md
          Copy-Item packaging/THIRD-PARTY-NOTICES.md dist/LegalLibrary/THIRD-PARTY-NOTICES.md
          Copy-Item docs/MAINTAINER-GUIDE.md dist/LegalLibrary/MAINTAINER-GUIDE.md
          Copy-Item docs/RELEASE-HANDOFF.md dist/LegalLibrary/RELEASE-HANDOFF.md
          Copy-Item docs dist/LegalLibrary/docs -Recurse
          Set-Content dist/LegalLibrary/MAINTAINER-GUIDE.md '[Open the maintainer guide](docs/MAINTAINER-GUIDE.md).'
          Set-Content dist/LegalLibrary/RELEASE-HANDOFF.md '[Open the release handoff](docs/RELEASE-HANDOFF.md).'
          New-Item -ItemType Directory -Force dist/LegalLibrary/tests/browser | Out-Null
          Copy-Item tests/browser/README.md dist/LegalLibrary/tests/browser/README.md
          Copy-Item 04-decisions dist/LegalLibrary/04-decisions -Recurse
          New-Item -ItemType Directory -Force dist/LegalLibrary/packaging | Out-Null
          Copy-Item packaging/THIRD-PARTY-NOTICES.md dist/LegalLibrary/packaging/THIRD-PARTY-NOTICES.md
          Copy-Item README.md dist/LegalLibrary/README.md
          python packaging/collect_licenses.py dist/LegalLibrary
      - uses: actions/upload-artifact@v4
        with:
          name: Legal-Library-Windows-x64
          path: dist/LegalLibrary
          retention-days: 14
