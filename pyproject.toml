[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-platform"
version = "0.1.0"
description = "Legal Knowledge Platform — evidence-grounded legal Q&A (Banking Legal Platform)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "TBD" }
dependencies = [
    "pydantic>=2.5,<3",
    "pymupdf>=1.23,<2",
    "pdf2image>=1.16,<2",
    "pytesseract>=0.3,<0.4",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
]

[project.scripts]
legal-platform = "legal_platform.__main__:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["backend"]